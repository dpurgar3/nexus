<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png">
<link rel="apple-touch-icon" href="ikona-192.png">
<title>NEXUS AI</title>
<style>
:root{
  --bg:#0d0f14; --panel:#151821; --panel2:#1c2030; --line:#262b3b;
  --text:#e8eaf0; --muted:#8a90a6; --accent:#7c5cff; --accent2:#22d3ee;
  --user:#23283a; --danger:#ef4444; --ok:#22c55e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
#app{display:flex;height:100vh;height:100dvh}
/* sidebar */
#side{width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:18px 16px 12px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{font-size:18px;letter-spacing:2px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:0}
#newBtn{margin:4px 12px 10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
#newBtn:hover{border-color:var(--accent)}
#search{margin:0 12px 8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#convs{flex:1;overflow:auto;padding:0 8px}
.conv{padding:9px 10px;border-radius:8px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.conv span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.conv:hover{background:var(--panel2);color:var(--text)}
.conv.active{background:var(--panel2);color:var(--text)}
.conv .del{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px}
.conv:hover .del{opacity:1}
.conv .del:hover{color:var(--danger)}
.sidefoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px}
.sidefoot button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);font-size:13px}
.sidefoot button:hover{color:var(--text);border-color:var(--accent)}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
#menuBtn{display:none;border:0;background:none;color:var(--text);font-size:20px}
#status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
#dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}
#dot.on{background:var(--ok)}
#clock{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
#idxBtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;padding:5px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
#idxBtn:hover{color:var(--text);border-color:var(--accent)}
#model{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#msgs{flex:1;overflow:auto;padding:24px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.msg{display:flex;gap:12px;margin:0 0 22px}
.av{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700}
.msg.ai .av{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.msg.user .av{background:var(--user);color:var(--muted)}
.body{flex:1;min-width:0}
.msg.user .bubble{background:var(--user);padding:10px 14px;border-radius:12px;display:inline-block;white-space:pre-wrap;max-width:100%}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin:0}
.bubble pre{background:#0a0c10;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:13px}
.bubble code{font-family:Consolas,monospace;background:#0a0c10;padding:1px 5px;border-radius:4px;font-size:13px}
.bubble pre code{background:none;padding:0}
.bubble ul,.bubble ol{margin:0 0 10px;padding-left:22px}
.bubble h1,.bubble h2,.bubble h3{margin:12px 0 8px;font-size:16px}
.bubble table{border-collapse:collapse;margin:0 0 10px}
.bubble td,.bubble th{border:1px solid var(--line);padding:4px 8px}
.tools{margin-top:6px;display:flex;gap:8px}
.tools button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px}
.tools button:hover{color:var(--text)}
.thumbs img{max-height:120px;border-radius:8px;margin:6px 6px 0 0;border:1px solid var(--line)}
.att{font-size:12px;color:var(--accent2);margin-top:4px}
.cursor::after{content:"▍";animation:b 1s infinite;color:var(--accent2)}
@keyframes b{50%{opacity:0}}
#welcome{text-align:center;margin-top:12vh;color:var(--muted)}
#welcome h1{color:var(--text);font-size:30px;letter-spacing:4px;margin:14px 0 6px}
#welcome .logo{width:64px;height:64px;font-size:26px;margin:auto;border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:20px;font-size:13px}
.chip:hover{border-color:var(--accent)}
/* input */
#bottom{padding:10px 0 16px}
#box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
#box:focus-within{border-color:var(--accent)}
#pending{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;background:var(--panel2);border-radius:6px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.pill button{border:0;background:none;color:var(--muted);padding:0}
#inp{width:100%;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;max-height:220px;padding:6px}
.row{display:flex;align-items:center;gap:6px}
.ib{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px;border-radius:8px}
.ib:hover{color:var(--text);background:var(--panel2)}
.act{border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.act h4{margin:0 0 6px;font-size:14px}
.act .row2{font-size:13px;color:var(--muted);white-space:pre-wrap;margin:2px 0}
.act .row2 b{color:var(--text)}
.act .btns{display:flex;gap:8px;margin-top:8px}
.act .btns button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.act .ok{background:var(--ok);color:#000}.act .no{background:var(--panel2);color:var(--text)}
.act .st{font-size:13px;margin-top:6px}
#micBtn.rec{color:#fff;background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}
.ib.web{font-size:13px;border:1px solid var(--line)}
.ib.web.on{color:var(--accent2);border-color:var(--accent2)}
.att a{color:var(--accent2);margin-right:8px}
#send{margin-left:auto;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600}
#send.stop{background:var(--danger)}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);padding:20px;max-height:90vh;overflow:auto}
.card h2{margin:0 0 12px;font-size:18px}
.card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.card textarea,.card input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.card textarea{min-height:240px}
.card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.card .acts button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text)}
.card .acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}
#err{display:none;background:#3a1418;border:1px solid #7f1d1d;color:#fecaca;padding:10px 14px;border-radius:10px;margin:0 auto 12px;max-width:780px;font-size:13px}
@media(max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.2s}
  #side.open{transform:none}
  #menuBtn{display:block}
}
#top{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
#bottom{padding-bottom:max(12px,env(safe-area-inset-bottom))}
.wrap{padding:0 12px}
#inp{font-size:16px}
.calls{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.callBtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#16a34a;color:#fff;text-decoration:none;font-weight:600;font-size:16px;border:0;cursor:pointer}
.callBtn small{font-weight:400;opacity:.9}
.callBtn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
#micBtn{font-size:22px;width:46px;height:46px;border-radius:50%;background:var(--panel2);color:var(--text)}
#send{padding:10px 18px}
.ib.web{font-size:12px}
.tools button{padding:6px 6px}
#welcome{margin-top:6vh}
.conv .del{opacity:1}
#setup{max-width:520px;margin:6vh auto;padding:0 16px;text-align:center;color:var(--muted)}
#setup h1{color:var(--text);letter-spacing:4px}
#setup .logo{width:64px;height:64px;font-size:26px;margin:auto;border-radius:18px}
#setup input{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
#setup button{margin-top:10px;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600}

</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo">N</div><div><b>NEXUS AI</b><small>osobni asistent · mobitel</small></div></div>
    <button id="newBtn">＋ Novi razgovor</button>
    <input id="search" placeholder="Traži razgovore…">
    <div id="convs"></div>
    <div class="sidefoot">
      <button id="setBtn">⚙ Postavke</button>
      <button id="expBtn">⤓ Spremi</button>
      <button id="impBtn">⤒ Učitaj</button>
    </div>
  </aside>
  <main id="main">
    <div id="top">
      <button id="menuBtn">☰</button>
      <div id="status"><div id="dot"></div><span id="stxt">Spajanje…</span></div>
      <span id="clock"></span>
    </div>
    <div id="msgs"><div class="wrap" id="list"></div></div>
    <div id="err"></div>
    <div id="bottom"><div class="wrap">
      <div id="box">
        <div id="pending"></div>
        <textarea id="inp" rows="1" placeholder="Pitaj NEXUS bilo što…"></textarea>
        <div class="row">
          <button class="ib" id="camBtn" title="Fotografiraj">📷</button>
          <button class="ib" id="attBtn" title="Priloži sliku ili datoteku">📎</button>
          <button class="ib web" id="webBtn" title="Pretraga interneta">🌐</button>
          <button class="ib web" id="qBtn" title="Točno = provjerene činjenice (sporije), Brzo = brži odgovori">🎯</button>
          <button class="ib" id="micBtn" title="Govori">🎤</button>
          <button id="send">Pošalji</button>
        </div>
      </div>
    </div></div>
  </main>
</div>
<input type="file" id="file" multiple hidden accept="image/*,.txt,.md,.csv,.json">
<input type="file" id="cam" hidden accept="image/*" capture="environment">
<input type="file" id="impFile" hidden accept=".json,application/json">

<div id="modal"><div class="card">
  <h2>Postavke NEXUS-a</h2>
  <label>Gemini API ključ</label>
  <input id="gkeyTxt" type="password" placeholder="zalijepi ključ" autocomplete="off">
  <label>NEXUS ključ (za kalendar, mail, kontakte i znanje)</label>
  <input id="tokTxt" type="password" autocomplete="off">
  <label>Dodatne upute za NEXUS (neobavezno)</label>
  <textarea id="sysTxt" style="min-height:120px"></textarea>
  <label>Kreativnost (0 = precizno, 1 = maštovito)</label>
  <input id="tempTxt" type="number" min="0" max="1.5" step="0.1">
  <label><input type="checkbox" id="ttsChk" style="width:auto"> Automatski pročitaj odgovor naglas kad pitam glasom</label>
  <div class="acts">
    <button id="refreshK">↻ Osvježi znanje</button>
    <button id="closeSet">Odustani</button>
    <button class="pri" id="saveSet">Spremi</button>
  </div>
</div></div>
<script>
const BASE_SYS = `Ti si NEXUS AI, osobni AI asistent svog vlasnika (sve o njemu i njegovom poslu piše u bloku ZNANJE). Radiš na njegovom mobitelu.

Kako radiš:
- Uvijek odgovaraš na hrvatskom (osim kad traži drugi jezik).
- Kratko i direktno, korak po korak. Na mobitelu je — bez dugih uvoda. Bez nepotrebnih opcija i teorije; daj najbolje rješenje koje radi.
- Pomažeš oko objava za društvene mreže, ponuda, cjenika, e-mailova, prijevoda (njemački, engleski), ideja za evente i marketing, računanja i planiranja.
- Ako nešto ne znaš, reci — ne izmišljaj. Za aktualne stvari koristi pretragu interneta kad je imaš.

Radni modovi (kad ih spomene):
- CEO mod: zanemari sitnice, daj 1–2 odluke s najvećim učinkom.
- Sokratski mod: postavljaj jedno po jedno pitanje dok ne razumiješ problem, tek onda rješenje.
- Kreativni direktor: odbaci generičke ideje, daj originalna rješenja.
- Đavolji advokat: najjači argument protiv odluke.
- Red team: pronađi sve rupe i rizike, ne slaži se iz ljubaznosti.`;
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('nexus_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v, quiet){ try{ localStorage.setItem('nexus_'+k, JSON.stringify(v)); return true; }catch(e){ if (!quiet) showErr('Spremanje nije uspjelo (memorija preglednika puna?). Spremi razgovore gumbom "Spremi".'); return false; } }
};
let settings = LS.get('settings', {sys: '', temp: 0.6, tts: true});
let convs = LS.get('convs', []);
let currentId = LS.get('current', null);
let pending = [];
let controller = null;
let webPref = LS.get('web2', true);
let knowledge = LS.get('znanje', []);
let lastVoice = false;
const GTOKEN_GET = () => settings.token || '';
function stripImgs(keepLast){
  const all = [];
  convs.forEach(c => c.messages.forEach(m => { if (m.images && m.images.length) all.push(m); }));
  all.slice(0, keepLast ? -1 : undefined).forEach(m => { m.imgCount = m.images.length; delete m.images; delete m.imgMimes; });
}
function save(){
  LS.set('current', currentId, true);
  if (LS.set('convs', convs, true)) return;
  stripImgs(true);  // makni starije slike, zadnju zadrži
  if (LS.set('convs', convs, true)) return;
  stripImgs(false); // makni sve slike
  LS.set('convs', convs);
}
function cur(){ return convs.find(c => c.id === currentId); }
function showErr(t){ const e=$('#err'); e.textContent=t; e.style.display='block'; const ok = /^✅|^Učitano|^Znanje osvježeno/.test(t); e.style.background = ok ? '#0f2a1a' : ''; e.style.borderColor = ok ? '#166534' : ''; e.style.color = ok ? '#bbf7d0' : ''; clearTimeout(showErr.t); showErr.t=setTimeout(()=>e.style.display='none', 9000); }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- mini markdown (radi offline) ---------- */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
          .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
          .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent2)">$1</a>');
}
function md(src){
  const parts = esc(src).split(/```/);
  let out = '';
  parts.forEach((p, i) => {
    if (i % 2){ out += '<pre><code>' + p.replace(/^[a-zA-Z0-9+-]*\n/, '') + '</code></pre>'; return; }
    const lines = p.split('\n'); let list = null, para = [], table = [];
    const flushP = () => { if (para.length){ out += '<p>' + inline(para.join('<br>')) + '</p>'; para = []; } };
    const flushL = () => { if (list){ out += '</' + list + '>'; list = null; } };
    const flushT = () => { if (table.length){
        out += '<table>' + table.filter(r => !/^\|?\s*:?-+/.test(r)).map((r, ri) => '<tr>' + r.replace(/^\||\|$/g,'').split('|').map(c => (ri? '<td>':'<th>') + inline(c.trim()) + (ri? '</td>':'</th>')).join('') + '</tr>').join('') + '</table>';
        table = []; } };
    for (const l of lines){
      let m;
      if (/^\s*\|.*\|\s*$/.test(l)){ flushP(); flushL(); table.push(l.trim()); continue; } else flushT();
      if ((m = l.match(/^(#{1,3})\s+(.*)/))){ flushP(); flushL(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if (list !== 'ul'){ flushL(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if (list !== 'ol'){ flushL(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; }
      else if (!l.trim()){ flushP(); flushL(); }
      else { flushL(); para.push(l); }
    }
    flushP(); flushL(); flushT();
  });
  return out;
}

function renderConvs(){
  const q = $('#search').value.toLowerCase();
  $('#convs').innerHTML = '';
  convs.filter(c => !q || c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q)))
    .sort((a,b) => b.updated - a.updated)
    .forEach(c => {
      const d = document.createElement('div');
      d.className = 'conv' + (c.id === currentId ? ' active' : '');
      d.innerHTML = `<span>${esc(c.title)}</span><button class="del" title="Obriši">✕</button>`;
      d.onclick = () => { currentId = c.id; save(); renderAll(); $('#side').classList.remove('open'); };
      d.querySelector('.del').onclick = e => {
        e.stopPropagation();
        if (!confirm('Obrisati razgovor "' + c.title + '"?')) return;
        convs = convs.filter(x => x.id !== c.id);
        if (currentId === c.id) currentId = null;
        save(); renderAll();
      };
      $('#convs').appendChild(d);
    });
}
const ACT_RE = /```nexus-akcija\s*([\s\S]*?)(```|$)/g;
function parseActs(t){ const out = []; let x; ACT_RE.lastIndex = 0; while ((x = ACT_RE.exec(t || ''))){ try{ out.push(JSON.parse(x[1].trim())); }catch(e){} } return out; }
function stripActs(t){ return (t || '').replace(ACT_RE, '').trim(); }
function accUrl(acc){
  const urls = gUrls(); const want = /dpurgar/i.test(acc || '') ? 'dpurgar3' : 'artistdrazen';
  return urls.find(u => gName(u).includes(want)) || urls[0];
}
function actCard(m, a, i){
  const st = m.acts && m.acts[i];
  const acc = /dpurgar/i.test(a.racun || '') ? 'dpurgar3@gmail.com' : 'artistdrazen@gmail.com';
  let h = '';
  if (a.radnja === 'termin'){
    h = `<h4>📅 Novi termin u kalendaru (${acc})</h4><div class="row2"><b>${esc(a.naslov || '')}</b></div><div class="row2">🕒 ${esc(a.pocetak || '')}${a.kraj ? ' → ' + esc(a.kraj) : ''}</div>` + (a.mjesto ? `<div class="row2">📍 ${esc(a.mjesto)}</div>` : '') + (a.opis ? `<div class="row2">${esc(a.opis)}</div>` : '');
  } else if (a.radnja === 'mail' || a.radnja === 'nacrt'){
    h = `<h4>${a.radnja === 'mail' ? '✉️ Slanje maila' : '📝 Nacrt maila u Gmailu'} (s ${acc})</h4><div class="row2">Za: <b>${esc(a.za || '?')}</b>${a.cc ? ' · cc: ' + esc(a.cc) : ''}</div><div class="row2">Naslov: <b>${esc(a.naslov || '')}</b></div><div class="row2">${esc(a.tekst || '')}</div><div class="row2"><i>+ tvoj potpis</i></div>`;

async function geminiCandidates(){

  const j = await r.json();
  if (j.error) throw new Error('Gemini ključ ne radi (' + (j.error.status || r.status) + ')');

  for (let i = 0; i < Math.max(A.length, B.length); i++){ if (A[i]) out.push(A[i]); if (B[i]) out.push(B[i]); }
  [...flash, ...lite].forEach(n => { if (!out.includes(n)) out.push(n); });

}

/* ---------- pozivi: "nazovi Emanuelu Maurić" ---------- */
const CALL_RE = /^\s*(nazovi|nazovite|pozovi|zovi|nazvati|nazovem|telefoniraj|okreni|zvrcni|birati|biraj)\s+(mi\s+|molim\s+te\s+)?(.+?)[\s.!?]*$/i;
function telNorm(n){ let t = String(n || '').replace(/[^\d+]/g, ''); if (/^00/.test(t)) t = '+' + t.slice(2); return t; }
function dial(tel){ try{ window.location.href = 'tel:' + tel; }catch(e){} }
async function pickAndCall(m){
  if (!('contacts' in navigator && navigator.contacts.select)){ showErr('Ovaj preglednik ne može otvoriti imenik. Dodaj kontakt u Google kontakte ili upiši broj: "nazovi 091 234 5678".'); return; }
  try{
    const res = await navigator.contacts.select(['name', 'tel'], {multiple: false});
    if (!res || !res.length || !res[0].tel || !res[0].tel.length){ showErr('Kontakt nema broj telefona.'); return; }
    const ime = (res[0].name && res[0].name[0]) || 'kontakt';
    m.calls = res[0].tel.map(t => ({ime, broj: t, tel: telNorm(t)})); m.pickContact = false;
    save(); renderAll(); dial(m.calls[0].tel);
  }catch(e){ showErr('Imenik: ' + e.message); }
}
async function callIntent(c, text){
  const x = text.match(CALL_RE); if (!x) return false;
  let who = x[3].replace(/\b(na mobitel|na mob|na telefon|na posao|privatno)\b/gi, '').trim();
  const ai = {role:'assistant', content:''};
  // izravno broj
  const digits = who.replace(/[^\d+]/g, '');
  if (digits.length >= 6 && /^[\d\s+\-\/()]+$/.test(who)){
    ai.content = 'Otvaram biranje broja **' + who + '**. Pritisni zelenu slušalicu.';
    ai.calls = [{ime: 'Nazovi', broj: who, tel: telNorm(who)}];
    c.messages.push(ai); save(); renderAll(); dial(ai.calls[0].tel); return true;
  }
  ai.content = '📞 Tražim broj od **' + who + '**…';
  c.messages.push(ai); save(); renderAll();
  let found = [];
  if (gUrls().length){
    try{
      const all = await gCallAll({a:'kontakti', q: nameStem(who)});
      const seen = new Set();
      all.forEach(({j}) => (j.kontakti || []).forEach(k => (k.telefoni || []).forEach(t => {
        const broj = t.replace(/\s*\([^)]*\)\s*$/, '').trim(); const tel = telNorm(broj);
        const vrsta = (t.match(/\(([^)]+)\)\s*$/) || [, ''])[1];
        if (tel.length >= 6 && !seen.has(tel)){ seen.add(tel); found.push({ime: k.ime || who, broj: broj + (vrsta ? ' · ' + vrsta : ''), tel}); }
      })));
    }catch(e){ console.warn('kontakti', e); }
  }
  if (found.length > 1){
    // najbolje podudaranje imena prvo
    const w = nameStem(who).toLowerCase().split(/\s+/);
    const score = f => w.filter(p => f.ime.toLowerCase().includes(p)).length;
    found.sort((a, b) => score(b) - score(a));
    const top = score(found[0]);
    const best = found.filter(f => score(f) === top);
    if (best.length === 1 || best.every(f => f.ime === best[0].ime)) found = best;
  }
  if (!found.length){
    ai.content = 'Nisam našao **' + who + '** u tvojim Google kontaktima' + (gUrls().length ? '' : ' (mobitel još nije povezan s računalom)') + '. Odaberi kontakt iz imenika ili upiši broj, npr. „nazovi 091 234 5678“.';
    ai.pickContact = true;
  } else if (found.length === 1){
    ai.content = 'Zovem **' + found[0].ime + '** (' + found[0].broj + '). Pritisni zelenu slušalicu.';
    ai.calls = found;
  } else {
    ai.content = 'Našao sam više brojeva za **' + who + '**. Dodirni koji želiš nazvati:';
    ai.calls = found.slice(0, 6);
  }
  ai.stats = '📞 kontakti';
  save(); renderAll();
  if (found.length === 1) dial(found[0].tel);
  if (lastVoice && settings.tts) speak(ai.content.replace(/\*\*/g, '').replace(/\(.*?\)/g, ''));
  lastVoice = false;
  return true;
}
async function send(){
  if (controller){ controller.abort(); return; }
  const text = $('#inp').value.trim();
  if (!text && !pending.length) return;
  let c = cur();
  if (!c){ c = {id: Date.now().toString(36), title: (text || pending[0].name).slice(0, 48), messages: [], updated: Date.now()}; convs.push(c); currentId = c.id; }
  const files = pending.filter(p => p.type === 'text');
  const imgs = pending.filter(p => p.type === 'image');
  const m = {role:'user', content: text || '(priloženo)'};
  if (forceNext){ m.forceQ = forceNext; forceNext = null; }
  if (files.length){
    m.files = files.map(f => f.name);
    m.apiContent = m.content + '\n\n' + files.map(f => `--- Datoteka: ${f.name} ---\n${f.data}\n--- kraj ---`).join('\n\n');
  }
  if (imgs.length){ m.images = imgs.map(i => i.data); m.imgMimes = imgs.map(i => i.mime); }
  c.messages.push(m); c.updated = Date.now();
  $('#inp').value = ''; autosize(); pending = []; renderPending();
  if (!files.length && !imgs.length && CALL_RE.test(text)){ if (await callIntent(c, text)) return; }
  const tq = timeAnswer(text);
  if (tq){ c.messages.push({role:'assistant', content: tq, stats:'🕒 sat mobitela · odmah'}); save(); renderAll(); if (lastVoice && settings.tts) speak(tq); lastVoice = false; return; }
  save(); renderAll();
  await runAI(c);
}
async function regen(idx){

  c.messages.splice(idx, 1); save(); renderMsgs();

}

function renderPending(){
  $('#pending').innerHTML = '';
  pending.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pill';
    d.innerHTML = `${p.type === 'image' ? '🖼' : '📄'} ${esc(p.name)} <button>✕</button>`;
    d.querySelector('button').onclick = () => { pending.splice(i, 1); renderPending(); };
    $('#pending').appendChild(d);
  });
}
function shrinkImg(dataUrl, type){
  return new Promise(res => {
    const fallback = () => res({mime: type || 'image/jpeg', data: dataUrl.split(',')[1]});
    const img = new Image();
    img.onload = () => {
      try{
        const MAX = 1600, k = Math.min(1, MAX / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        res({mime: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.82).split(',')[1]});
      }catch(e){ fallback(); }
    };
    img.onerror = fallback;
    img.src = dataUrl;
  });
}
function addFiles(list){
  [...list].forEach(f => {
    const rd = new FileReader();
    if (f.type.startsWith('image/')){
      rd.onload = () => shrinkImg(rd.result, f.type).then(r => { pending.push({type:'image', name:f.name || 'slika.jpg', mime: r.mime, data: r.data}); renderPending(); });
      rd.readAsDataURL(f);
    } else {
      if (f.size > 400000){ showErr(f.name + ' je prevelika (max ~400 KB teksta).'); return; }
      rd.onload = () => { pending.push({type:'text', name:f.name, data: rd.result}); renderPending(); };
      rd.readAsText(f);
    }
  });
}

  try{

function knowledgeText(){
  if (!knowledge.length) return '';
  let t = '\n\n===== ZNANJE O VLASNIKU I NJEGOVOM POSLU (koristi kad je relevantno; ne nabrajaj bez potrebe) =====\n';
  let total = 0;
  for (const f of knowledge){ if (total > 60000) break; t += '\n### ' + f.name + '\n' + f.text + '\n'; total += f.text.length; }

/* ---------- glas: čitanje odgovora ---------- */
function speak(t){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const clean = (t || '').replace(/```[\s\S]*?```/g, '').replace(/[*#`>|_]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').slice(0, 1500);
    const u = new SpeechSynthesisUtterance(clean); u.lang = 'hr-HR'; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find(x => /^hr/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function setSending(on){ const b = $('#send'); b.textContent = on ? '■ Stani' : 'Pošalji'; b.classList.toggle('stop', on); }
async function runAI(c){
  if (!settings.gkey){ showErr('Upiši Gemini ključ u ⚙ Postavke.'); $('#setBtn').click(); return; }
  const voice = lastVoice; lastVoice = false;
  const last = c.messages[c.messages.length - 1];
  const ai = {role:'assistant', content:''};
  c.messages.push(ai);
  const el = msgEl(ai); el.querySelector('.bubble').classList.add('cursor');
  $('#list').appendChild(el); scrollDown();
  controller = new AbortController(); setSending(true);
  try{
    if (last && last.role === 'user' && !last.gDone && gUrls().length && (CAL_RE.test(last.content) || MAIL_RE.test(last.content) || CONT_RE.test(last.content) || /(pošalji|posalji|napiši|napisi|nacrt).{0,25}(mail|e-mail|poruk)/i.test(last.content))){
      const bubG = el.querySelector('.bubble');
      bubG.innerHTML = '<i style="color:var(--muted)">📅 Gledam kalendar / mail / kontakte…</i>';
      try{ const g = await googleContext(last.content); if (g){ last.apiContent = (last.apiContent || last.content) + g.text; last.sources = (last.sources || []).concat(g.used.map(u => ({title: 'Google ' + u, url: u === 'mail' ? 'https://mail.google.com' : u === 'kalendar' ? 'https://calendar.google.com' : 'https://contacts.google.com'}))); } }catch(e){ showErr('Google: ' + e.message); }
      last.gDone = true; bubG.innerHTML = '';
    }
    if (last && last.sources) ai.sources = last.sources.slice();
    const bub2 = el.querySelector('.bubble'); const t0 = Date.now(); let gotTok = false;
    const tick = setInterval(() => { if (!gotTok) bub2.innerHTML = '<i style="color:var(--muted)">NEXUS razmišlja… ' + Math.round((Date.now() - t0) / 1000) + ' s</i>'; }, 1000);
    const sys = BASE_SYS + (settings.sys ? '\n\nDODATNE UPUTE:\n' + settings.sys : '') + knowledgeText() + actsHelp() + qualityText() + '\n\n' + nowText();
    const hist = apiHistory(c);
    if (hist.length){ const lm = hist[hist.length - 1]; if (lm.role === 'user') lm.content = (lm.content || '') + '\n\n[' + nowText() + ']'; }
    const onText = t => {
      if (!gotTok){ gotTok = true; clearInterval(tick); }
      ai.content += t;
      el.querySelector('.bubble').innerHTML = md(stripActs(ai.content));
      scrollDown();
    };
    const onSources = list => { const have = new Set((ai.sources || []).map(s => s.url)); ai.sources = (ai.sources || []).concat(list.filter(s => !have.has(s.url))).slice(0, 8); };
    try{
      const forceQ = last && last.forceQ;
      const gm = await runGemini(sys, hist, controller.signal, onText, onSources, (webPref || !!forceQ) && navigator.onLine, forceQ);
      ai.stats = '✨ ' + gm + (tocno || (last && last.forceQ) ? ' · 🎯 točno' : '') + ' · ' + Math.round((Date.now() - t0) / 1000) + ' s';
    } finally { clearInterval(tick); }
  }catch(e){
    if (e.name !== 'AbortError'){
      const msg = /fetch|network|Failed/i.test(e.message) ? 'Nema veze s internetom ili Gemini ne odgovara. Pokušaj ponovno.' : e.message;
      showErr(msg); if (!ai.content) ai.content = '⚠️ ' + msg;
    }
  }
  ai.content = ai.content.trim() || (controller && controller.signal.aborted ? '_(prekinuto)_' : '⚠️ Gemini nije vratio odgovor. Klikni ↻ Ponovi.');
  c.updated = Date.now(); controller = null; setSending(false); save(); renderAll();
  if (voice && settings.tts && ai.content && !/^⚠️/.test(ai.content)) speak(stripActs(ai.content));
}

// ---------- Glasovni unos (mikrofon) ----------
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $('#micBtn'); let rec = null, on = false, base = '', finalTxt = '', failed = false;
  const stop = () => { if (rec && on) rec.stop(); };
  function start(){
    if (!SR){ showErr('Ovaj preglednik ne podržava govor. Otvori NEXUS u Google Chromeu ili koristi mikrofon na tipkovnici.'); return; }
    if (controller) return;
    rec = new SR(); rec.lang = 'hr-HR'; rec.interimResults = true; rec.continuous = !/Android/i.test(navigator.userAgent); rec.maxAlternatives = 1;
    base = $('#inp').value.trim(); finalTxt = ''; failed = false; let silence;
    const arm = () => { clearTimeout(silence); silence = setTimeout(stop, 2500); };
    try{ speechSynthesis.cancel(); }catch(x){}
    rec.onstart = () => { on = true; btn.classList.add('rec'); btn.textContent = '⏺'; $('#inp').placeholder = 'Slušam… govori (klik na ⏺ za kraj)'; arm(); };
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalTxt += (finalTxt ? ' ' : '') + t.trim(); else interim += t;
      }
      $('#inp').value = [base, finalTxt, interim.trim()].filter(Boolean).join(' '); autosize(); arm();
    };
    rec.onerror = e => {
      failed = true;
      const m = {'not-allowed': 'Mikrofon nije dopušten. Postavke preglednika → Postavke web-mjesta → Mikrofon → Dopusti.',
                 'service-not-allowed': 'Mikrofon nije dopušten u ovom pregledniku.',
                 'network': 'Prepoznavanje govora treba internet. Provjeri vezu ili koristi mikrofon na tipkovnici.',
                 'no-speech': 'Nisam čuo ništa. Klikni 🎤 i govori.',
                 'audio-capture': 'Ne nalazim mikrofon. Provjeri je li spojen i odabran u Windowsima.'}[e.error] || ('Greška mikrofona: ' + e.error);
      showErr(m);
    };
    rec.onend = () => {
      on = false; clearTimeout(silence); btn.classList.remove('rec'); btn.textContent = '🎤'; $('#inp').placeholder = 'Pitaj NEXUS bilo što…';
      if (!failed && finalTxt && $('#inp').value.trim()){ lastVoice = true; send(); }
    };
    try{ rec.start(); }catch(err){ showErr('Mikrofon se ne može pokrenuti: ' + err.message); }
  }
  btn.onclick = () => on ? stop() : start();
  document.addEventListener('keydown', e => { if (e.ctrlKey && (e.key === 'm' || e.key === 'M')){ e.preventDefault(); btn.click(); } });
})();
