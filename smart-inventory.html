<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Inventura</title><style>body{font:16px system-ui;background:#16191f;color:#fff;max-width:900px;margin:auto;padding:20px}textarea,select,button{font:inherit;padding:10px;margin:8px 0}textarea{width:95%;min-height:240px;background:#252a32;color:white}button{background:#00a4ef;color:#111;border:0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Smart Inventory 3.5.1</h1><p>Lokalni pregled bez knjiženja. Unesi artikle, prodaju i normative u tablice. Ne učitavaj stvarne podatke na javno računalo.</p><label>Lokal <select id="venue"><option>NOMAD</option><option>Artist</option></select></label><div id="tables"></div><textarea id="data" hidden aria-label="Inventurni podaci"></textarea><label>Pretraži rezultate <input id="filter"></label><div id="summary"></div><button id="print" disabled>Ispis inventure</button><style>.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #555;text-align:left}td input{width:110px;padding:6px} .short{color:#ff8066}.extra{color:#a5db60}@media print{body{background:white;color:black}#tables,button,textarea,select,#filter,#result{display:none} .short,.extra{color:black}}</style><button id="demo">Primjer</button> <button id="calc">Izračunaj</button> <button id="download" disabled>Izvoz CSV</button> <button id="clear">Očisti</button><pre id="result" role="status"></pre><script type="module">
import {inventory} from './src/smart-inventory.js';
const el=id=>document.getElementById(id);let report=null;
function reset(){report=null;el('result').textContent='';el('download').disabled=true;el('print').disabled=true;el('summary').replaceChildren();}
const specs={items:[['id','Šifra'],['unit','Jedinica kg/L/kom'],['opening','Početno',1],['received','Nabava',1],['actual','Stvarno',1],['minimum','Minimum',1],['purchase_price','Nabavna cijena',1]],sales:[['id','ID prodaje'],['product_id','Šifra proizvoda'],['quantity','Prodano',1]],recipes:[['product_id','Šifra proizvoda'],['ingredient_id','Šifra sastojka'],['unit','Jedinica'],['quantity','Normativ',1]]};
const tables={};const node=(tag,txt)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n;};
function add(kind,row={}){const tr=node('tr');for(const [key,label,numeric] of specs[kind]){const td=node('td'),i=node('input');i.setAttribute('aria-label',label);i.dataset.key=key;if(numeric){i.type='number';i.min='0';i.step='any';}i.value=row[key]??'';i.oninput=reset;td.append(i);tr.append(td);}const td=node('td'),b=node('button','Ukloni');b.onclick=()=>{tr.remove();reset();};td.append(b);tr.append(td);tables[kind].append(tr);}
for(const [kind,label] of Object.entries({items:'Artikli',sales:'Prodaja',recipes:'Normativi'})){const section=node('section'),wrap=node('div'),table=node('table'),head=node('tr'),body=node('tbody'),b=node('button','Dodaj redak');wrap.className='scroll';for(const [,label] of specs[kind])head.append(node('th',label));head.append(node('th','Radnja'));table.append(head,body);tables[kind]=body;b.onclick=()=>{add(kind);reset();};wrap.append(table);section.append(node('h2',label),wrap,b);el('tables').append(section);}
function collect(){const d={};for(const kind of Object.keys(specs)){d[kind]=Array.from(tables[kind].rows,tr=>{const r={venue:el('venue').value};for(const [key,,numeric] of specs[kind]){const v=tr.querySelector('[data-key="'+key+'"]').value.trim();if(!v)throw Error('Popuni sva polja: '+key);r[key]=numeric?Number(v):v;}return r;});}return d;}
function render(){const out=el('summary');out.replaceChildren();if(!report)return;const t=node('table'),h=node('tr');for(const label of ['Artikl','JM','Očekivano','Stvarno','Razlika','Nabava do minimuma'])h.append(node('th',label));t.append(h);for(const r of report.rows){if(!String(r.id).toLowerCase().includes(el('filter').value.toLowerCase()))continue;const tr=node('tr');tr.className=r.difference< -1e-9?'short':r.difference>1e-9?'extra':'';for(const v of [r.id,r.unit,r.expected,r.actual,r.difference,r.suggested_to_minimum])tr.append(node('td',typeof v==='number'?v.toLocaleString('hr-HR',{maximumFractionDigits:4}):v));t.append(tr);}out.append(node('h2','Inventura – '+report.venue),node('p','Vrijednost: '+report.stock_value.toFixed(2)+' EUR'+(report.complete?'':' | NEPOTPUN OBRAČUN')),t);}
el('filter').oninput=render;el('print').onclick=()=>{if(report?.complete){el('filter').value='';render();window.print();}};
el('data').oninput=reset;el('venue').onchange=()=>{for(const t of Object.values(tables))t.replaceChildren();reset();};
el('clear').onclick=()=>{el('data').value='';for(const t of Object.values(tables))t.replaceChildren();reset();};
el('demo').onclick=()=>{reset();const venue=el('venue').value;el('data').value=JSON.stringify({items:[{venue,id:'coffee',unit:'kg',opening:2,received:1,actual:2,minimum:2.5,purchase_price:20}],sales:[{venue,id:'s1',product_id:'espresso',quantity:100}],recipes:[{venue,product_id:'espresso',ingredient_id:'coffee',unit:'kg',quantity:0.008}]},null,2);const d=JSON.parse(el('data').value);for(const k of Object.keys(tables)){tables[k].replaceChildren();for(const r of d[k])add(k,r);}};
el('calc').onclick=()=>{reset();try{if(el('data').value.length>2000000)throw Error('Prevelik unos');const d=collect();for(const k of ['items','sales','recipes'])if(!Array.isArray(d[k])||d[k].length>10000)throw Error('Neispravan popis');report=inventory({...d,venue:el('venue').value});el('result').textContent=report.complete?'Obračun spreman.':'Nedostaju normativi: '+report.missing_recipes.join(', ');el('download').disabled=!report.complete;el('print').disabled=!report.complete;render();}catch(e){el('result').textContent=e.message;}};
el('download').onclick=()=>{if(!report?.complete)return;const keys=['id','unit','opening','received','used','expected','actual','difference','stock_value','suggested_to_minimum'];const cell=v=>{let s=String(v??'');if(typeof v!=='number'&&/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const csv=[['venue',...keys].map(cell).join(';'),...report.rows.map(r=>[report.venue,...keys.map(k=>r[k])].map(cell).join(';'))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='inventura-'+report.venue+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
