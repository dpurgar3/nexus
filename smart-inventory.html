<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Inventura</title><style>body{font:16px system-ui;background:#16191f;color:#fff;max-width:900px;margin:auto;padding:20px}textarea,select,button{font:inherit;padding:10px;margin:8px 0}textarea{width:95%;min-height:240px;background:#252a32;color:white}button{background:#00a4ef;color:#111;border:0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Smart Inventory 3.5.1</h1><p>Lokalni pregled bez knjiženja. Unesi JSON s poljima items, sales i recipes. Ne učitavaj stvarne podatke na javno računalo.</p><label>Lokal <select id="venue"><option>NOMAD</option><option>Artist</option></select></label><textarea id="data" aria-label="Inventurni podaci"></textarea><button id="demo">Primjer</button> <button id="calc">Izračunaj</button> <button id="download" disabled>Izvoz CSV</button> <button id="clear">Očisti</button><pre id="result" role="status"></pre><script type="module">
import {inventory} from './src/smart-inventory.js';
const el=id=>document.getElementById(id);let report=null;
function reset(){report=null;el('result').textContent='';el('download').disabled=true;}
el('data').oninput=reset;el('venue').onchange=reset;
el('clear').onclick=()=>{el('data').value='';reset();};
el('demo').onclick=()=>{reset();const venue=el('venue').value;el('data').value=JSON.stringify({items:[{venue,id:'coffee',unit:'kg',opening:2,received:1,actual:2,minimum:2.5,purchase_price:20}],sales:[{venue,id:'s1',product_id:'espresso',quantity:100}],recipes:[{venue,product_id:'espresso',ingredient_id:'coffee',unit:'kg',quantity:0.008}]},null,2);};
el('calc').onclick=()=>{reset();try{if(el('data').value.length>2000000)throw Error('Prevelik unos');const d=JSON.parse(el('data').value);for(const k of ['items','sales','recipes'])if(!Array.isArray(d[k])||d[k].length>10000)throw Error('Neispravan popis');report=inventory({...d,venue:el('venue').value});el('result').textContent=JSON.stringify(report,null,2);el('download').disabled=!report.complete;}catch(e){el('result').textContent=e.message;}};
el('download').onclick=()=>{if(!report?.complete)return;const keys=['id','unit','opening','received','used','expected','actual','difference','stock_value','suggested_to_minimum'];const cell=v=>{let s=String(v??'');if(typeof v!=='number'&&/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const csv=[['venue',...keys].map(cell).join(';'),...report.rows.map(r=>[report.venue,...keys.map(k=>r[k])].map(cell).join(';'))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='inventura-'+report.venue+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
