name: NEXUS Auto APK
on:
  push:
    branches: [main]
    paths: ['android-auto/**', '.github/workflows/nexus-auto.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Kljuc za potpis
        run: base64 -d keystore.b64 > app/nexus.jks
      - name: Izgradi APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk NexusAuto.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-auto
          name: NEXUS Auto (Android Auto)
          target_commitish: ${{ github.sha }}
          body: 'Instalacija: preuzmi NexusAuto.apk na mobitel i otvori ga. Izgradnja br. ${{ github.run_number }}.'
          files: android-auto/NexusAuto.apk
          make_latest: true
