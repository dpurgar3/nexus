plugins {
    id 'com.android.application'
}

android {
    namespace 'space.nomadinfo.nexus'
    compileSdk 34

    defaultConfig {
        applicationId 'space.nomadinfo.nexus'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        nexus {
            storeFile file('nexus.jks')
            storePassword 'nexusauto'
            keyAlias 'nexus'
            keyPassword 'nexusauto'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.nexus
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

