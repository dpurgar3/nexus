<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Secure AI test</title><style>body{background:#16191f;color:white;font:16px system-ui;max-width:600px;margin:30px auto;padding:16px}input,textarea,button{box-sizing:border-box;padding:12px;border-radius:8px;font:inherit;margin:6px 0}input,textarea{width:100%}button{border:0;color:#101010;font-weight:bold} [hidden]{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>NEXSUS Secure AI</h1><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="E-mail" required><input id="password" type="password" autocomplete="current-password" placeholder="Lozinka" required><button style="background:#7fba00">Prijava</button></form><section id="panel" hidden><textarea id="prompt" maxlength="8000" placeholder="Testni upit"></textarea><button id="gemini" style="background:#00a4ef">Gemini</button> <button id="groq" style="background:#ffb900">Groq</button> <button id="logout" style="background:#f25022">Odjava</button></section><pre id="result" role="status"></pre><script type="module">import{login,logout,currentUser,onAuthChange,askAI}from './src/nexus-auth.js';const e=id=>document.getElementById(id);let epoch=0;function show(u){epoch++;e('panel').hidden=!u;e('loginForm').hidden=!!u;e('result').textContent='';if(!u)e('prompt').value=''}onAuthChange((event,u)=>{if(event==='SIGNED_OUT'||event==='SIGNED_IN'||event==='INITIAL_SESSION')show(u)});e('loginForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button');b.disabled=true;try{show(await login(e('email').value,e('password').value))}catch{e('result').textContent='Prijava nije uspjela.'}finally{e('password').value='';b.disabled=false}};e('logout').onclick=async()=>{show(null);try{await logout()}finally{location.reload()}};for(const provider of ['gemini','groq'])e(provider).onclick=async()=>{const p=e('prompt').value.trim();if(!p)return;const n=epoch;e('gemini').disabled=e('groq').disabled=true;e('result').textContent='Čekanje odgovora…';try{const t=await askAI(provider,p);if(n===epoch)e('result').textContent=t||'Prazan odgovor.'}catch{if(n===epoch)e('result').textContent='Zahtjev nije uspio. Provjeri ovlasti i konfiguraciju.'}finally{e('gemini').disabled=e('groq').disabled=false}};show(await currentUser());</script></html>
