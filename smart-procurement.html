<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Procurement 3.7.1</title><style>body{font:16px system-ui;background:#16191f;color:white;padding:16px;max-width:1200px;margin:auto}button,input,select{font:inherit;padding:8px;margin:4px}button{background:#00a4ef;border:0;border-radius:5px}button:disabled{opacity:.4}td,th{padding:5px;text-align:left}input{width:105px} .scroll{overflow:auto} .critical{color:#ff8060}.reorder{color:#ffb900}.normal{color:#7fba00}</style><h1>NEXSUS Procurement 3.7.1</h1><p>Lokalni prijedlozi nabave. Bez slanja narudžbi.</p><label>Lokal <select id="venue"><option>NOMAD</option><option>Artist</option></select></label><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><button id="add">Dodaj artikl</button><button id="demo">Simulacija</button><button id="calc">Izračunaj</button><button id="clear">Očisti</button><p id="status" role="status"></p><div id="out"></div><button id="csv" disabled>Izvoz CSV</button><script type="module">
import {procurement} from './src/smart-procurement.js';
const el=id=>document.getElementById(id),n=(tag,t)=>{const e=document.createElement(tag);if(t!==undefined)e.textContent=t;return e;};
const fields=[['id','Šifra'],['name','Artikl'],['supplier','Dobavljač'],['unit','JM'],['stock','Zaliha'],['dailyUse','Dnevna potrošnja'],['leadDays','Rok isporuke (dani)'],['reviewDays','Razmak narudžbi (dani)'],['safetyStock','Sigurnosna zaliha'],['packSize','Pakiranje'],['onOrder','Već naručeno'],['unitCost','Cijena EUR/JM']];
let result=null;function reset(){result=null;el('out').replaceChildren();el('status').textContent='';el('csv').disabled=true;}
const header=n('tr');for(const [,label] of fields)header.append(n('th',label));header.append(n('th','Radnja'));el('head').append(header);
function add(r={}){if(el('rows').rows.length>=1000)return;const tr=n('tr');for(const [k,label] of fields){const td=n('td'),i=n(k==='unit'?'select':'input');if(k==='unit')for(const u of ['kg','L','kom']){const o=n('option',u);o.value=u;i.append(o);}i.dataset.key=k;i.setAttribute('aria-label',label);i.value=r[k]??(k==='unit'?'kom':'');if(fields.findIndex(f=>f[0]===k)>=4)i.inputMode='decimal';i.oninput=reset;td.append(i);tr.append(td);}const td=n('td'),b=n('button','Ukloni');b.onclick=()=>{tr.remove();reset();};td.append(b);tr.append(td);el('rows').append(tr);reset();}
function collect(){return Array.from(el('rows').rows,tr=>{const r={venue:el('venue').value};for(const [k] of fields){const s=tr.querySelector('[data-key="'+k+'"]').value.trim();if(!s)throw Error('Popuni sva polja');if(fields.findIndex(f=>f[0]===k)>=4){if(!/^\d+(?:[.,]\d+)?$/.test(s))throw Error('Neispravan broj: '+k);r[k]=Number(s.replace(',','.'));}else r[k]=s;}return r;});}
const eur=v=>v.toLocaleString('hr-HR',{style:'currency',currency:'EUR'}),fmt=v=>v.toLocaleString('hr-HR',{maximumFractionDigits:6});
function clear(){el('rows').replaceChildren();reset();}
el('clear').onclick=clear;el('venue').onchange=clear;el('add').onclick=()=>add();
el('demo').onclick=()=>{clear();add({id:'DEMO1',name:'Kava',supplier:'Demo A',unit:'kg',stock:2,dailyUse:1,leadDays:2,reviewDays:3,safetyStock:2,packSize:1,onOrder:0,unitCost:20});add({id:'DEMO2',name:'Mlijeko',supplier:'Demo B',unit:'L',stock:3,dailyUse:6,leadDays:2,reviewDays:3,safetyStock:6,packSize:6,onOrder:0,unitCost:1});};
el('calc').onclick=()=>{reset();try{const rows=collect();if(!rows.length)throw Error('Dodaj artikle');const rank={critical:0,reorder:1,normal:2};result=procurement(el('venue').value,rows).sort((a,b)=>rank[a.status]-rank[b.status]||a.name.localeCompare(b.name));const total=result.reduce((s,r)=>s+r.estimatedCost,0);if(!Number.isFinite(total)||total>Number.MAX_SAFE_INTEGER/100)throw Error('Prevelik ukupni iznos');const out=el('out'),table=n('table'),h=n('tr');for(const label of ['Artikl','Dobavljač','Hitnost','Količina','Pakiranja','Procjena'])h.append(n('th',label));table.append(h);for(const r of result){const tr=n('tr');tr.className=r.status;for(const v of [r.name,r.supplier,({critical:'Kritično',reorder:'Naručiti',normal:'Uredno'})[r.status],fmt(r.quantity)+' '+r.unit,String(r.packs),eur(r.estimatedCost)])tr.append(n('td',v));table.append(tr);}const wrap=n('div');wrap.className='scroll';wrap.append(table);out.append(n('h2','Ukupna procjena: '+eur(total)),wrap);el('csv').disabled=false;el('status').textContent='Prijedlog za ručnu provjeru.';}catch(e){reset();el('status').textContent=e.message;}};
function cell(v){let s=String(v);if(/^[\s]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
el('csv').onclick=()=>{if(!result)return;const rows=[['Lokal','Šifra','Artikl','Dobavljač','JM','Količina','Pakiranja','Procjena EUR','Status'],...result.map(r=>[r.venue,r.id,r.name,r.supplier,r.unit,String(r.quantity).replace('.',','),r.packs,r.estimatedCost.toFixed(2).replace('.',','),r.status])];const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=n('a');a.href=url;a.download='nabava-'+el('venue').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
