<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Document Engine</title><style>body{background:#16191f;color:white;font:16px system-ui;margin:24px}main{max-width:900px;margin:auto}label{display:block;margin:12px 0}button,select,input{font:inherit;padding:8px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#292e36;padding:16px}a{color:#65caff}</style><main><a href="command-center.html">Natrag</a><h1>Document Engine 4.0.2</h1><p>Lokalni pregled. Bez spremanja ili slanja dokumenata.</p><label>Lokal <select id="venue"><option>NOMAD</option><option>Artist</option></select></label><label>Vrsta <select id="kind"><option value="prices">Cjenik</option><option value="stock">Zalihe</option><option value="recipes">Normativi</option><option value="taxes">Porezi</option><option value="kpd">KPD</option><option value="sales">Prodajni artikli</option><option value="invoices">Računi</option></select></label><label>Datoteka <input id="file" type="file" accept=".pdf,.xlsx,.csv"></label><button id="read">Pregledaj</button> <button id="clear">Očisti</button><p id="status" role="status"></p><pre id="out"></pre></main><script type="module">
import {readNative,localReaders} from './src/remaris-native-reader.js';
import {parseCSV} from './src/remaris-import.js';
const el=id=>document.getElementById(id);let epoch=0;
function clear(){epoch++;el('out').textContent='';el('status').textContent='';}
for(const id of ['venue','kind','file'])el(id).onchange=clear;
el('clear').onclick=()=>{clear();el('file').value='';};
el('read').onclick=async()=>{clear();const token=epoch;try{const f=el('file').files[0],venue=el('venue').value,kind=el('kind').value;if(!f||f.size>10000000)throw Error('Odaberi datoteku do 10 MB');const ext=f.name.split('.').pop().toLowerCase();let result;if(ext==='csv'){if(f.size>2000000)throw Error('CSV do 2 MB');result={venue,kind,rows:parseCSV(await f.text(),';'),review:true};}else if(['pdf','xlsx'].includes(ext)){let readers;try{readers=await localReaders(ext);}catch{throw Error('Lokalni čitač nije instaliran ili nije kompatibilan.');}result=await readNative(f,venue,kind,readers);}else throw Error('Nepodržan format');if(token!==epoch)return;el('status').textContent='Pregled: '+result.rows.length+' zapisa ili stranica. Potrebna ručna provjera vrste i lokala. Prikaz prvih 100.';el('out').textContent=JSON.stringify(result.rows.slice(0,100),null,2);}catch(e){if(token===epoch)el('status').textContent=e.message;}};
</script></html>
