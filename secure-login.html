<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Secure 2.1</title><style>body{background:#16191f;color:#fff;font:16px system-ui;margin:0;min-height:100dvh;display:grid;place-items:center}main{width:min(90%,380px);box-sizing:border-box;background:#242830;padding:24px;border-radius:16px}h1{margin:12px 0}label,input,button{display:block;box-sizing:border-box;width:100%;margin:10px 0}input,button{padding:13px;border:0;border-radius:8px;font:inherit}button{color:#101010;font-weight:600;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}#login{background:#7fba00}#logout{background:#f25022}#check{background:#00a4ef}#clear{background:#ffb900}.logo{display:flex;gap:4px}.logo i{width:14px;height:14px} [hidden]{display:none!important}</style></head><body><main><div class="logo" aria-hidden="true"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></div><h1>NEXSUS AI</h1><p>Secure 2.1 · razvojna prijava</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Lozinka</label><input id="password" type="password" autocomplete="current-password" required><button id="login" type="submit">Prijavi se</button><button id="clear" type="reset">Očisti unos</button></form><section id="account" hidden><button id="check">Provjeri sesiju</button><button id="logout">Odjavi se</button></section><p id="status" role="status" aria-live="polite">Potrebna je prijava.</p></main><script type="module">import {login,logout,currentUser,onAuthChange} from './src/nexus-auth.js';const $=id=>document.getElementById(id);function show(user){$('form').hidden=!!user;$('account').hidden=!user;$('status').textContent=user?'Prijavljeni ste.':'Potrebna je prijava.'}onAuthChange((event,user)=>show(user));$('form').addEventListener('submit',async e=>{e.preventDefault();$('login').disabled=true;try{show(await login($('email').value,$('password').value))}catch{$('status').textContent='Prijava nije uspjela.'}finally{$('password').value='';$('login').disabled=false}});$('logout').onclick=async()=>{try{await logout();show(null)}catch{$('status').textContent='Odjava nije uspjela.'}};$('check').onclick=async()=>show(await currentUser());show(await currentUser());</script></body></html>
