<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXSUS Finance</title><style>body{font:16px system-ui;background:#16191f;color:white;max-width:1000px;margin:auto;padding:16px}input,select,button{font:inherit;padding:8px;margin:4px}button{background:#00a4ef;color:#111;border:0;border-radius:5px}.scroll{overflow:auto}table{border-collapse:collapse}td,th{padding:4px;text-align:left}td input{width:125px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{background:#292e36;padding:14px;border-radius:8px}.bar{height:16px;background:#00a4ef} @media print{body{background:white;color:black}#entry,button{display:none}.metric{background:white;border:1px solid #aaa}}</style><h1>NEXSUS Finance 3.6.1</h1><p>Neovisni lokalni obračun. Iznosi se unose u EUR, porezi prema dokumentu. Nema povezivanja s Remarisom.</p><div id="entry"><label>Lokal <select id="venue"><option>NOMAD</option><option>Artist</option></select></label><label>Od <input type="date" id="from"></label><label>Do <input type="date" id="to"></label><div id="tables"></div><button id="demo">Simulacija</button><button id="calc">Izračunaj</button><button id="clear">Očisti</button></div><p id="status" role="status"></p><div id="out"></div><button id="print" disabled>Ispis / PDF</button><script type="module">
import {financial} from './src/financial-intelligence.js';
const el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
const specs={sales:[['id','Račun'],['date','Datum','date'],['gross','Promet EUR','money'],['vat','PDV EUR','money'],['consumptionTax','PP EUR','money']],costs:[['id','ID troška'],['date','Datum','date'],['sale_id','Račun'],['net','Nabavna vrijednost EUR','money']],expenses:[['id','ID troška'],['date','Datum','date'],['net','Operativni trošak EUR','money']]};
const bodies={};let report=null;
function reset(){report=null;el('out').replaceChildren();el('status').textContent='';el('print').disabled=true;}
function add(kind,r={}){const tr=node('tr');for(const [key,label,type] of specs[kind]){const td=node('td'),i=node('input');i.dataset.key=key;i.setAttribute('aria-label',label);if(type==='date')i.type='date';if(type==='money')i.inputMode='decimal';i.value=r[key]??'';i.oninput=reset;td.append(i);tr.append(td);}const td=node('td'),b=node('button','Ukloni');b.onclick=()=>{tr.remove();reset();};td.append(b);tr.append(td);bodies[kind].append(tr);}
for(const [kind,label] of Object.entries({sales:'Prodaja',costs:'Nabavna vrijednost po računu',expenses:'Operativni troškovi'})){const wrap=node('div'),t=node('table'),h=node('tr'),b=node('button','Dodaj redak');wrap.className='scroll';for(const [,label] of specs[kind])h.append(node('th',label));h.append(node('th','Radnja'));bodies[kind]=node('tbody');t.append(h,bodies[kind]);wrap.append(t);b.onclick=()=>{add(kind);reset();};el('tables').append(node('h2',label),wrap,b);}
function cents(v){const s=v.trim().replace(',','.');if(!/^-?\d+(?:\.\d{1,2})?$/.test(s))throw Error('Iznos mora imati najviše dvije decimale');const neg=s.startsWith('-'),[whole,fraction='']=s.replace(/^-/,'').split('.');const n=Number(whole)*100+Number(fraction.padEnd(2,'0'));if(!Number.isSafeInteger(n))throw Error('Prevelik iznos');return neg?-n:n;}
function collect(){const d={venue:el('venue').value,from:el('from').value,to:el('to').value};for(const kind of Object.keys(specs)){if(bodies[kind].rows.length>10000)throw Error('Previše redaka');d[kind]=Array.from(bodies[kind].rows,tr=>{const r={venue:d.venue};for(const [key,,type] of specs[kind]){const v=tr.querySelector('[data-key="'+key+'"]').value.trim();if(!v)throw Error('Popuni sva polja');r[key]=type==='money'?cents(v):v;}return r;});}if(!d.sales.length)throw Error('Unesi barem jedan račun');return d;}
const eur=n=>n===null?'Nedostaju podaci':(n/100).toLocaleString('hr-HR',{style:'currency',currency:'EUR'});
function render(r){const out=el('out'),cards=node('div');cards.className='cards';out.append(node('h2',r.venue+' | '+r.from+' – '+r.to));for(const [label,v] of [['Promet',r.gross],['PDV',r.vat],['Porez na potrošnju',r.consumptionTax],['Neto prihod',r.net],['Nabavna vrijednost (unesena)',r.cogs],['Bruto marža',r.margin],['Operativni troškovi (uneseni)',r.opex],['Procijenjeni rezultat',r.operatingEstimate]]){const c=node('div');c.className='metric';c.append(node('div',label),node('h3',eur(v)));cards.append(c);}out.append(cards,node('p','Rezultat nije službena računovodstvena dobit. Potpunost troškova mora provjeriti korisnik.'),node('h2','Dnevni promet'));const max=Math.max(1,...r.daily.map(d=>Math.abs(d.gross)));for(const d of r.daily){const b=node('div');b.className='bar';b.style.width=(Math.abs(d.gross)/max*100)+'%';if(d.gross<0)b.style.background='#f25022';out.append(node('p',d.date+' | '+eur(d.gross)),b);}if(!r.complete)out.append(node('p','Nedostaje nabavna vrijednost računa: '+r.missingCostSaleIds.join(', ')));}
function clear(){for(const b of Object.values(bodies))b.replaceChildren();reset();}
el('clear').onclick=clear;el('venue').onchange=clear;el('from').onchange=el('to').onchange=reset;
el('demo').onclick=()=>{clear();const date='2026-11-27';el('from').value=el('to').value=date;add('sales',{id:'DEMO-1',date,gross:'128',vat:'25',consumptionTax:'3'});add('costs',{id:'DEMO-C',date,sale_id:'DEMO-1',net:'30'});add('expenses',{id:'DEMO-E',date,net:'20'});};
el('calc').onclick=()=>{reset();try{report=financial(collect());render(report);el('print').disabled=!report.complete;el('status').textContent=report.complete?'Obračun spreman za pregled.':'Nepotpun obračun.';}catch(e){el('status').textContent=e.message;}};
el('print').onclick=()=>{if(report?.complete)window.print();};
</script></html>
